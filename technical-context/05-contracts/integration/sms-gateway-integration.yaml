# SMS Gateway Integration Contract
# Contract for SMS gateway provider integration

openapi: 3.0.3
info:
  title: SMS Gateway Integration
  description: |
    Integration contract for SMS gateway provider.
    
    This contract defines the interface for sending SMS notifications and tracking delivery status.
  version: 1.0.0
  contact:
    name: DFMS Technical Team
    email: Mahfuzur.rahman@brainstation-23.com

servers:
  - url: https://sms-gateway.example.com/api/v1
    description: SMS Gateway API

paths:
  /sms/send:
    post:
      summary: Send SMS
      operationId: sendSMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient:
                  type: string
                  pattern: '^\+?[0-9]{10,15}$'
                  description: Recipient phone number
                message:
                  type: string
                  maxLength: 160
                  description: SMS message content
                template_id:
                  type: string
                  nullable: true
                  description: Template ID for templated messages
                template_params:
                  type: object
                  nullable: true
                  additionalProperties:
                    type: string
                  description: Template parameters
                priority:
                  type: string
                  enum: [low, normal, high]
                  default: normal
                  description: Message priority
              required:
                - recipient
                - message
      responses:
        '200':
          description: SMS sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [queued, sent, failed]
                  queued_at:
                    type: string
                    format: date-time
        '400':
          description: Invalid request
        '429':
          description: Rate limit exceeded
  
  /sms/batch:
    post:
      summary: Send SMS batch
      operationId: sendSMSBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      recipient:
                        type: string
                      message:
                        type: string
                      template_id:
                        type: string
                        nullable: true
                      template_params:
                        type: object
                        nullable: true
              required:
                - messages
      responses:
        '200':
          description: Batch SMS sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  processed:
                    type: integer
                  failed:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        message_id:
                          type: string
                        status:
                          type: string
  
  /sms/{message_id}/status:
    get:
      summary: Get SMS delivery status
      operationId: getSMSStatus
      parameters:
        - name: message_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SMS delivery status
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [queued, sent, delivered, failed, expired]
                  sent_at:
                    type: string
                    format: date-time
                    nullable: true
                  delivered_at:
                    type: string
                    format: date-time
                    nullable: true
                  failure_reason:
                    type: string
                    nullable: true
        '404':
          description: Message not found
  
  /sms/templates:
    get:
      summary: List SMS templates
      operationId: listSMSTemplates
      responses:
        '200':
          description: List of SMS templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      properties:
                        template_id:
                          type: string
                        name:
                          type: string
                        content:
                          type: string
                        parameters:
                          type: array
                          items:
                            type: string

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key

security:
  - apiKey: []

