          type: string
        contact_number:
          type: string
          nullable: true
        purpose:
          type: string
          description: Reason for gate entry
        poi_id:
          type: string
          format: uuid
        registered_at:
          type: string
          format: date-time
        registered_by:
          type: string
          format: uuid
      required:
        - id
        - name
        - vehicle_registration
        - purpose
        - poi_id
        - registered_at

    TemporaryPartyCreate:
