components:
  schemas:
    # ── Vehicles ─────────────────────────────────
    Vehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vehicle_code:
          type: string
          example: VH-0001
        registration_number:
          type: string
        make:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        type:
          $ref: '../schemas/common-schemas.yaml#/components/schemas/VehicleType'
        capacity:
          type: number
          format: decimal
        owner_type:
          $ref: '../schemas/common-schemas.yaml#/components/schemas/FleetType'
        status:
          type: string
          enum: [available, assigned, maintenance, inactive]
        vendor_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - registration_number
        - type
        - capacity
        - owner_type
        - status

    VehicleCreate:
      type: object
      properties:
        registration_number:
          type: string
        make:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        type:
          $ref: '../schemas/common-schemas.yaml#/components/schemas/VehicleType'
        capacity:
          type: number
          format: decimal
        owner_type:
          $ref: '../schemas/common-schemas.yaml#/components/schemas/FleetType'
        vendor_id:
          type: string
          format: uuid
          nullable: true
      required:
        - registration_number
        - type
        - capacity
        - owner_type

    VehicleUpdate:
      type: object
      properties:
        make:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        capacity:
          type: number
          format: decimal
        status:
          type: string
          enum: [available, assigned, maintenance, inactive]
        vendor_id:
          type: string
          format: uuid
          nullable: true

    # ── Drivers ──────────────────────────────────
    Driver:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        contact_number:
          type: string
        nid_number:
          type: string
          nullable: true
        license_number:
          type: string
        license_valid_until:
          type: string
          format: date
        address:
          $ref: '#/components/schemas/AddressObject'
        vendor_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [available, assigned, on_leave, inactive]
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - contact_number
        - license_number
        - license_valid_until
        - status

    DriverCreate:
      type: object
      properties:
        name:
          type: string
        contact_number:
          type: string
        nid_number:
          type: string
          nullable: true
        license_number:
          type: string
        license_valid_until:
          type: string
          format: date
        address:
          $ref: '#/components/schemas/AddressObject'
        vendor_id:
          type: string
          format: uuid
          nullable: true
      required:
        - name
        - contact_number
        - license_number
        - license_valid_until

