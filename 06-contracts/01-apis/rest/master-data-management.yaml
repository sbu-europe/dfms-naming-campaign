        contact_name:
          type: string
          nullable: true
        contact_phone:
          type: string
          nullable: true
        contact_email:
          type: string
          format: email
          nullable: true
        address:
          $ref: '#/components/schemas/AddressObject'
        zone_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [active, inactive]

    # ── Routes ────────────────────────────────────
    Route:
      type: object
      properties:
        id:
          type: string
          format: uuid
        route_code:
          type: string
          example: RTE-0001
        name:
          type: string
        origin_poi_id:
          type: string
          format: uuid
        origin_poi_name:
          type: string
          readOnly: true
        destination_poi_id:
          type: string
          format: uuid
        destination_poi_name:
          type: string
          readOnly: true
        distance_km:
          type: number
          format: decimal
          nullable: true
        estimated_duration_min:
          type: integer
          nullable: true
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - route_code
        - name
        - origin_poi_id
        - destination_poi_id
        - status

    RouteCreate:
      type: object
      properties:
        name:
          type: string
        origin_poi_id:
          type: string
          format: uuid
        destination_poi_id:
          type: string
          format: uuid
        distance_km:
          type: number
          format: decimal
          nullable: true
        estimated_duration_min:
          type: integer
          nullable: true
      required:
        - name
        - origin_poi_id
        - destination_poi_id

    RouteUpdate:
      type: object
      properties:
        name:
          type: string
        distance_km:
          type: number
          format: decimal
          nullable: true
        estimated_duration_min:
          type: integer
          nullable: true
        status:
          type: string
          enum: [active, inactive]

    # ── Zones ─────────────────────────────────────
    Zone:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        boundary_coordinates:
          type: array
          description: "GeoJSON polygon coordinates: array of [longitude, latitude] pairs"
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - code

    ZoneCreate:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        boundary_coordinates:
          type: array
          nullable: true
          items:
            type: array
            items:
              type: number
      required:
        - name
        - code

    ZoneUpdate:
      type: object
      properties:
        name:
          type: string
        boundary_coordinates:
          type: array
          nullable: true
          items:
            type: array
            items:
              type: number
        is_active:
          type: boolean

    # ── Shared ────────────────────────────────────
    AddressObject:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        country:
          type: string
          default: Bangladesh
      required:
        - street
        - city
        - country

    BulkUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: CSV file for bulk import
      required:
        - file

  securitySchemes:
    bearerAuth:
      $ref: '../schemas/common-schemas.yaml#/components/securitySchemes/bearerAuth'

security:
  - bearerAuth: []
