openapi: 3.0.3
info:
  title: DFMS Master Data Management API
  description: |
    API contract for Master Data Management module in DFMS.
    
    This contract defines the interface for managing all master data entities:
    - Vehicles
    - Drivers
    - Helpers
    - Vendors (admin CRUD; vendor onboarding/bidding is in vendor-management.yaml)
    - POIs (Points of Interest with geofence configuration)
    - Products and Product Categories
    - Suppliers
    - Dealers
    - Routes
    - Zones
  version: 1.1.0
  contact:
    name: DFMS Technical Team
    email: Mahfuzur.rahman@brainstation-23.com

servers:
  - url: https://api.dfms.example.com/v1
    description: Production server

tags:
  - name: Vehicles
    description: Vehicle management operations
  - name: Drivers
    description: Driver management operations
  - name: Helpers
    description: Helper (loader/unloader) management operations
  - name: Vendors
    description: Vendor master data CRUD operations
  - name: POIs
    description: Point of Interest management and geofence configuration
  - name: Products
    description: Product management operations
  - name: ProductCategories
    description: Product category management operations
  - name: Suppliers
    description: Supplier master data operations
  - name: Dealers
    description: Dealer master data operations
  - name: Routes
    description: Route definition and management operations
  - name: Zones
    description: Geographic zone management operations

paths:
  # ─────────────────────────────────────────────
  # Vehicles
  # ─────────────────────────────────────────────
  /vehicles:
    get:
      tags: [Vehicles]
      summary: List vehicles
      operationId: listVehicles
      parameters:
        - $ref: '../schemas/common-schemas.yaml#/components/parameters/PageParam'
        - $ref: '../schemas/common-schemas.yaml#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [available, assigned, maintenance, inactive]
        - name: owner_type
          in: query
          schema:
            type: string
            enum: [own, vendor]
        - name: vendor_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of vehicles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common-schemas.yaml#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Vehicle'

    post:
      tags: [Vehicles]
      summary: Create vehicle
      operationId: createVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleCreate'
      responses:
        '201':
          description: Vehicle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '../schemas/common-schemas.yaml#/components/responses/BadRequest'

  /vehicles/{id}:
    get:
      tags: [Vehicles]
      summary: Get vehicle by ID
      operationId: getVehicle
      parameters:
        - $ref: '../schemas/common-schemas.yaml#/components/parameters/UUIDParam'
      responses:
        '200':
          description: Vehicle details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '404':
          $ref: '../schemas/common-schemas.yaml#/components/responses/NotFound'

    put:
      tags: [Vehicles]
      summary: Update vehicle
      operationId: updateVehicle
      parameters:
        - $ref: '../schemas/common-schemas.yaml#/components/parameters/UUIDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleUpdate'
      responses:
        '200':
          description: Vehicle updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '404':
          $ref: '../schemas/common-schemas.yaml#/components/responses/NotFound'

    delete:
      tags: [Vehicles]
      summary: Delete vehicle (soft delete)
      operationId: deleteVehicle
      parameters:
        - $ref: '../schemas/common-schemas.yaml#/components/parameters/UUIDParam'
      responses:
        '204':
