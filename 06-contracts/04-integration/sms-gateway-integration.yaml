# SMS Gateway Integration Contract
# Provider: MiM SMS API V2 (https://www.mimsms.com/api-documentation)

openapi: 3.0.3
info:
  title: MiM SMS Gateway Integration
  description: |
    Integration contract for MiM SMS API V2 used by DFMS for transactional SMS
    (staff/driver invitations, login OTP, password reset, vendor phone OTP).

    Backend implementation: `nourish-backend/apps/notifications/sms.py`
  version: 2.0.0
  contact:
    name: DFMS Technical Team
    email: Mahfuzur.rahman@brainstation-23.com

servers:
  - url: https://api.mimsms.com
    description: MiM SMS API V2 production

paths:
  /api/V2/SMS:
    post:
      summary: Send single transactional SMS
      operationId: sendTransactionalSMS
      description: |
        Used by DFMS for OTP, invitations, password reset, and login codes.
        `transactionType` must be `T` (transactional).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingleSmsRequest'
      responses:
        '200':
          description: SMS accepted by MiM SMS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSendResponse'
        '400':
          description: Invalid request
        '401':
          description: Invalid credentials
        '429':
          description: Rate limit exceeded

  /api/V2/DSMS:
    post:
      summary: Send dynamic bulk SMS (personalized per recipient)
      operationId: sendDynamicBulkSMS
      description: |
        Optional DFMS path for bulk user/driver import where each row has a
        distinct message body (activation link + OTP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkSmsRequest'
      responses:
        '200':
          description: Bulk SMS accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSendResponse'

  /api/V2/DlrApi:
    post:
      summary: Delivery report lookup by tracking ID
      operationId: getDeliveryReport
      description: Not yet integrated in DFMS Phase 1 — reserved for future DLR polling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                apiKey:
                  type: string
                userName:
                  type: string
                trackingId:
                  type: string
              required:
                - apiKey
                - userName
                - trackingId
      responses:
        '200':
          description: Delivery status

components:
  schemas:
    SingleSmsRequest:
      type: object
      properties:
        apiKey:
          type: string
          description: MiM SMS API key (env `MIMSMS_API_KEY`)
        userName:
          type: string
          format: email
          description: Registered MiM account email (env `MIMSMS_USERNAME`)
        senderName:
          type: string
          description: Approved sender ID or masking number (env `MIMSMS_SENDER_NAME`)
        transactionType:
          type: string
          enum: [T, P]
          description: DFMS uses `T` (transactional) for all auth/onboarding SMS
        mobileNumber:
          type: string
          pattern: '^8801[3-9][0-9]{8}$'
          description: Bangladesh mobile without leading `+` (e.g. `8801712345678`)
        message:
          type: string
          description: SMS body (plain text)
        campaignName:
          type: string
          description: Optional reporting label (e.g. `dfms-staff-invite`)
      required:
        - apiKey
        - userName
        - senderName
        - transactionType
        - mobileNumber
        - message

    BulkSmsRequest:
      type: object
      properties:
        apiKey:
          type: string
        userName:
          type: string
          format: email
        senderName:
          type: string
        smsData:
          type: array
          items:
            type: object
            properties:
              mobNumber:
                type: string
                pattern: '^8801[3-9][0-9]{8}$'
              message:
                type: string
            required:
              - mobNumber
              - message
      required:
        - apiKey
        - userName
        - senderName
        - smsData

    SmsSendResponse:
      type: object
      properties:
        trackingId:
          type: string
          description: MiM tracking ID for DLR lookup
        statusCode:
          type: integer
        smsCount:
          type: integer

  securitySchemes:
    apiKeyInBody:
      type: apiKey
      in: body
      name: apiKey
      description: MiM credentials are sent in the JSON request body (apiKey + userName).

security:
  - apiKeyInBody: []
