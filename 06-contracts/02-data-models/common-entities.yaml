# Common Entities
# Shared entity definitions for DFMS

$schema: http://json-schema.org/draft-07/schema#
$id: https://dfms.example.com/schemas/common-entities.json

definitions:
  # Master Data Entities
  Vehicle:
    type: object
    properties:
      id:
        type: string
        format: uuid
      vehicle_code:
        type: string
        description: Internal business code (e.g., VH-0001)
      registration_number:
        type: string
        pattern: '^[A-Z0-9-]+$'
      make:
        type: string
        nullable: true
      model:
        type: string
        nullable: true
      year:
        type: integer
        nullable: true
      type:
        type: string
        enum: [covered_van, open_truck, container, refrigerated]
      capacity:
        type: number
        format: decimal
        minimum: 0
      owner_type:
        type: string
        enum: [own, vendor]
      status:
        type: string
        enum: [available, assigned, maintenance, inactive]
      vendor_id:
        type: string
        format: uuid
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    required:
      - id
      - registration_number
      - type
      - capacity
      - owner_type
      - status
  
  Driver:
    type: object
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
        minLength: 1
        maxLength: 100
      contact_number:
        type: string
        pattern: '^\+?[0-9]{10,15}$'
      nid_number:
        type: string
        description: National Identity Document number
        nullable: true
      license_number:
        type: string
      license_valid_until:
        type: string
        format: date
      address:
        $ref: '#/definitions/Address'
        nullable: true
      vendor_id:
        type: string
        format: uuid
        nullable: true
        description: Set when driver belongs to a vendor fleet
      status:
        type: string
        enum: [available, assigned, on_leave, inactive]
      rating:
        type: number
        format: float
        minimum: 0
        maximum: 5
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    required:
      - id
      - name
      - contact_number
      - license_number
      - license_valid_until
      - status
  
  Vendor:
    type: object
    properties:
      id:
        type: string
        format: uuid
      vendor_code:
        type: string
        description: Unique business identifier (e.g., VND-0001)
      name:
        type: string
        minLength: 1
        maxLength: 200
      registration_number:
        type: string
        description: Business registration or TIN number
        nullable: true
      registration_status:
        type: string
        enum: [pending_verification, verified, rejected]
      contact_number:
        type: string
      email:
        type: string
        format: email
        nullable: true
      address:
        $ref: '#/definitions/Address'
        nullable: true
      bank_details:
        type: object
        nullable: true
        properties:
          bank_name:
            type: string
          account_number:
            type: string
          routing_number:
            type: string
            nullable: true
      type:
        type: string
        enum: [contractual, non_contractual]
      contract_start_date:
        type: string
        format: date
        nullable: true
      contract_end_date:
        type: string
        format: date
        nullable: true
      status:
        type: string
        enum: [active, inactive, suspended]
      rating:
        type: number
        format: float
        minimum: 0
        maximum: 5
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    required:
      - id
      - vendor_code
      - name
      - registration_status
      - contact_number
      - type
      - status
  
  POI:
    type: object
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      address:
        type: string
      location:
        $ref: '#/definitions/Location'
      type:
        type: string
        enum: [factory, warehouse, cfs, customer, depot]
      contact_person:
        type: string
        nullable: true
      contact_number:
        type: string
        nullable: true
      created_at:
        type: string
        format: date-time
    required:
      - id
      - name
      - location
      - type
  
  Product:
    type: object
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      code:
        type: string
      sku:
        type: string
        nullable: true
      category_id:
        type: string
        format: uuid
        description: FK to ProductCategory
        nullable: true
      unit_of_measure:
        type: string
        enum: [kg, ton, piece, bag]
      weight_per_unit:
        type: number
        format: decimal
        nullable: true
      status:
        type: string
        enum: [active, inactive]
        default: active
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    required:
      - id
      - name
      - code
      - unit_of_measure
      - status
  
  # Transactional Entities
  ProductRequisition:
    type: object
    properties:
      id:
        type: string
        format: uuid
      pr_number:
        type: string
        pattern: '^PR-[0-9]{8}-[0-9]{4}$'
      product_id:
        type: string
        format: uuid
      quantity:
        type: number
        format: decimal
        minimum: 0
      origin_poi_id:
        type: string
        format: uuid
      destination_poi_id:
        type: string
        format: uuid
      requested_date:
        type: string
        format: date
      priority:
        type: string
        enum: [low, normal, high, urgent]
      status:
        type: string
        enum: [draft, pending_distribution_approval, pending_procurement_approval, approved, rejected, pending_stock]
      tr_id:
        type: string
        format: uuid
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    required:
      - id
      - pr_number
      - product_id
      - quantity
      - origin_poi_id
      - destination_poi_id
      - requested_date
      - priority
      - status
  
  TransportRequest:
    type: object
    properties:
      id:
        type: string
        format: uuid
      tr_number:
        type: string
        pattern: '^TR-[0-9]{8}-[0-9]{4}$'
      pr_id:
        type: string
        format: uuid
      product_id:
        type: string
        format: uuid
      quantity:
        type: number
        format: decimal
      origin_poi_id:
        type: string
        format: uuid
      destination_poi_id:
        type: string
        format: uuid
      vehicle_type_required:
        type: string
        enum: [covered_van, open_truck, container, refrigerated]
      priority:
        type: string
        enum: [low, normal, high, urgent]
      status:
        type: string
        enum: [pending, approved, to_created, cancelled]
      created_at:
        type: string
        format: date-time
    required:
      - id
      - tr_number
      - pr_id
      - product_id
      - quantity
      - origin_poi_id
      - destination_poi_id
      - status
  
  TransportOrder:
    type: object
    properties:
      id:
        type: string
        format: uuid
      to_number:
        type: string
        pattern: '^TO-[0-9]{8}-[0-9]{4}$'
      tr_id:
        type: string
        format: uuid
      fleet_type:
        type: string
        enum: [own, vendor]
      vehicle_id:
        type: string
        format: uuid
        nullable: true
      driver_id:
        type: string
        format: uuid
        nullable: true
      vendor_id:
        type: string
        format: uuid
        nullable: true
      scheduled_date:
        type: string
        format: date
      scheduled_time:
        type: string
        format: time
      status:
        type: string
        enum: [pending, assigned, in_transit, completed, cancelled]
      created_at:
        type: string
        format: date-time
    required:
      - id
      - to_number
      - tr_id
      - fleet_type
      - scheduled_date
      - status
  
  Trip:
    type: object
    properties:
      id:
        type: string
        format: uuid
      trip_number:
        type: string
        pattern: '^TRIP-[0-9]{8}-[0-9]{4}$'
      to_id:
        type: string
        format: uuid
      vehicle_id:
        type: string
        format: uuid
      driver_id:
        type: string
        format: uuid
      helper_id:
        type: string
        format: uuid
        nullable: true
        description: FK to Helper assigned to this trip
      scheduled_date:
        type: string
        format: date
      start_time:
        type: string
        format: date-time
        nullable: true
      end_time:
        type: string
        format: date-time
        nullable: true
      start_odometer:
        type: number
        format: decimal
        nullable: true
      end_odometer:
        type: number
        format: decimal
        nullable: true
      distance_traveled:
        type: number
        format: decimal
        nullable: true
      status:
        type: string
        enum: [pending, assigned, gate_in, loading, loading_complete, scale_in, in_transit, gate_out, unloading, scale_out, qc_pending, completed, on_hold, cancelled]
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    required:
      - id
      - trip_number
      - to_id
      - vehicle_id
      - driver_id
      - scheduled_date
      - status
  
  QCInspection:
    type: object
    properties:
      id:
        type: string
        format: uuid
      trip_id:
        type: string
        format: uuid
      inspection_type:
        type: string
        enum: [physical, physical_and_lab]
      status:
        type: string
        enum: [pending, in_progress, completed, failed]
      result:
        type: string
        enum: [pass, fail]
        nullable: true
      inspector_id:
        type: string
        format: uuid
        nullable: true
      photos:
        type: array
        items:
          type: string
          format: uri
      created_at:
        type: string
        format: date-time
      completed_at:
        type: string
        format: date-time
        nullable: true
    required:
      - id
      - trip_id
      - inspection_type
      - status
  
  Invoice:
    type: object
    properties:
      id:
        type: string
        format: uuid
      invoice_number:
        type: string
        pattern: '^INV-[0-9]{8}-[0-9]{4}$'
      vendor_id:
        type: string
        format: uuid
      trip_id:
        type: string
        format: uuid
      amount:
        $ref: '#/definitions/Money'
      tax:
        $ref: '#/definitions/Money'
      total_amount:
        $ref: '#/definitions/Money'
      status:
        type: string
        enum: [pending_approval, approved, paid, rejected]
      due_date:
        type: string
        format: date
      erp_sync_status:
        type: string
        enum: [pending, synced, failed]
      created_at:
        type: string
        format: date-time
    required:
      - id
      - invoice_number
      - vendor_id
      - amount
      - status
  
  # New Master Data Entities
  Helper:
    type: object
    description: Loading/unloading helper assigned to vehicles or trips
    properties:
      id:
        type: string
        format: uuid
      helper_code:
        type: string
        description: Unique business identifier (e.g., HLP-0001)
      name:
        type: string
        minLength: 1
        maxLength: 100
      nid_number:
        type: string
        nullable: true
      contact_number:
        type: string
        pattern: '^\+?[0-9]{10,15}$'
      address:
        $ref: '#/definitions/Address'
        nullable: true
      assigned_vehicle_id:
        type: string
        format: uuid
        nullable: true
      status:
        type: string
        enum: [available, assigned, inactive]
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    required:
      - id
      - helper_code
      - name
      - contact_number
      - status

  Supplier:
    type: object
    description: Raw material or product supplier (origin party)
    properties:
      id:
        type: string
        format: uuid
      supplier_code:
        type: string
        description: Unique business identifier (e.g., SUP-0001)
      name:
        type: string
        minLength: 1
        maxLength: 200
      contact:
        $ref: '#/definitions/Contact'
      address:
        $ref: '#/definitions/Address'
        nullable: true
      status:
        type: string
        enum: [active, inactive]
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    required:
      - id
      - supplier_code
      - name
      - status

  Dealer:
    type: object
    description: Distribution dealer or end-customer (destination party)
    properties:
      id:
        type: string
        format: uuid
      dealer_code:
        type: string
        description: Unique business identifier (e.g., DLR-0001)
      name:
        type: string
        minLength: 1
        maxLength: 200
      contact:
        $ref: '#/definitions/Contact'
      address:
        $ref: '#/definitions/Address'
        nullable: true
      zone_id:
        type: string
        format: uuid
        nullable: true
        description: FK to Zone for territory grouping
      status:
        type: string
        enum: [active, inactive]
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    required:
      - id
      - dealer_code
      - name
      - status

  Route:
    type: object
    description: Predefined route between two POIs
    properties:
      id:
        type: string
        format: uuid
      route_code:
        type: string
        description: Unique business identifier (e.g., RTE-0001)
      name:
        type: string
      origin_poi_id:
        type: string
        format: uuid
      destination_poi_id:
        type: string
        format: uuid
      distance_km:
        type: number
        format: decimal
        minimum: 0
        nullable: true
      estimated_duration_min:
        type: integer
        minimum: 0
        nullable: true
      status:
        type: string
        enum: [active, inactive]
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    required:
      - id
      - route_code
      - name
      - origin_poi_id
      - destination_poi_id
      - status

  ProductCategory:
    type: object
    description: Category grouping for products
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
        minLength: 1
        maxLength: 100
      code:
        type: string
        description: Short unique code (e.g., POULTRY, FEED)
      description:
        type: string
        nullable: true
      is_active:
        type: boolean
        default: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    required:
      - id
      - name
      - code

  Zone:
    type: object
    description: Geographic or administrative zone for territory management
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      code:
        type: string
      boundary_coordinates:
        type: array
        description: GeoJSON-style polygon coordinate array [[lng, lat], ...]
        items:
          type: array
          items:
            type: number
        nullable: true
      is_active:
        type: boolean
        default: true
      created_at:
        type: string
        format: date-time
    required:
      - id
      - name
      - code

  VendorBid:
    type: object
    description: Bid submitted by a vendor for a transport requisition
    properties:
      id:
        type: string
        format: uuid
      bid_number:
        type: string
        pattern: '^BID-[0-9]{8}-[0-9]{4}$'
      tr_id:
        type: string
        format: uuid
        description: FK to TransportRequest
      vendor_id:
        type: string
        format: uuid
      proposed_vehicle_id:
        type: string
        format: uuid
        nullable: true
      proposed_driver_id:
        type: string
        format: uuid
        nullable: true
      bid_amount:
        $ref: '#/definitions/Money'
      notes:
        type: string
        nullable: true
      status:
        type: string
        enum: [submitted, under_review, accepted, rejected, withdrawn]
      submitted_at:
        type: string
        format: date-time
      responded_at:
        type: string
        format: date-time
        nullable: true
    required:
      - id
      - bid_number
      - tr_id
      - vendor_id
      - bid_amount
      - status

  TripCost:
    type: object
    description: Calculated cost breakdown for a completed trip
    properties:
      id:
        type: string
        format: uuid
      trip_id:
        type: string
        format: uuid
      base_fare:
        $ref: '#/definitions/Money'
      distance_charge:
        $ref: '#/definitions/Money'
        nullable: true
      waiting_charge:
        $ref: '#/definitions/Money'
        nullable: true
      loading_charge:
        $ref: '#/definitions/Money'
        nullable: true
      toll_charge:
        $ref: '#/definitions/Money'
        nullable: true
      other_charges:
        $ref: '#/definitions/Money'
        nullable: true
      total_cost:
        $ref: '#/definitions/Money'
      calculated_at:
        type: string
        format: date-time
      approved_by:
        type: string
        format: uuid
        nullable: true
      approved_at:
        type: string
        format: date-time
        nullable: true
      status:
        type: string
        enum: [draft, pending_approval, approved, rejected]
    required:
      - id
      - trip_id
      - base_fare
      - total_cost
      - status

  # Value Objects
  Location:
    type: object
    properties:
      latitude:
        type: number
        format: float
        minimum: -90
        maximum: 90
      longitude:
        type: number
        format: float
        minimum: -180
        maximum: 180
      address:
        type: string
        nullable: true
    required:
      - latitude
      - longitude
  
  Money:
    type: object
    properties:
      amount:
        type: number
        format: decimal
        minimum: 0
      currency:
        type: string
        default: BDT
        pattern: '^[A-Z]{3}$'
    required:
      - amount
      - currency
  
  DateRange:
    type: object
    properties:
      start_date:
        type: string
        format: date
      end_date:
        type: string
        format: date
    required:
      - start_date
      - end_date
  
  Address:
    type: object
    properties:
      street:
        type: string
      city:
        type: string
      state:
        type: string
      postal_code:
        type: string
      country:
        type: string
        default: Bangladesh
    required:
      - street
      - city
      - country
  
  Contact:
    type: object
    properties:
      name:
        type: string
      phone:
        type: string
      email:
        type: string
        format: email
        nullable: true
    required:
      - name
      - phone

